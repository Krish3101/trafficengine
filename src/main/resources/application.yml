# The defaults match docker-compose.yml. On a server, set the DB_* variables instead.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:traffic}
    username: ${DB_USER:traffic}
    password: ${DB_PASSWORD:traffic}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: ${PORT:8080}

traffic:
  rules:
    currency: INR
    default-speed-limit-kph: 80.0
    zone-speed-limits:
      SCHOOL-ZONE: 30.0
      HIGHWAY-1: 100.0
    default-fine: 1000
    fine-tiers:
      - over-by-kph: 40.0
        amount: 5000
      - over-by-kph: 20.0
        amount: 2000
      - over-by-kph: 0.0
        amount: 1000
