# The defaults match the docker run line in the README. On a server, set the DB_* variables.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:traffic}
    username: ${DB_USER:traffic}
    password: ${DB_PASSWORD:traffic} # local container only
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${PORT:8080}

traffic:
  jurisdiction-time-zone: Asia/Kolkata
  rule-sets:
    - version: "2026-09"
      effective-from: 2026-01-01
      default-speed-limit-kph: 80.00
      zones:
        - id: SCHOOL-ZONE
          limit-kph: 30.00
        - id: HIGHWAY-1
          limit-kph: 100.00
      fine-tiers:
        - over-by-kph: 0.00
          amount: 1000.00
        - over-by-kph: 20.00
          amount: 2000.00
        - over-by-kph: 40.00
          amount: 5000.00
    - version: "2026-10"
      effective-from: 2026-10-01
      default-speed-limit-kph: 80.00
      zones:
        - id: SCHOOL-ZONE
          limit-kph: 25.00
        - id: HIGHWAY-1
          limit-kph: 100.00
      fine-tiers:
        - over-by-kph: 0.00
          amount: 1500.00
        - over-by-kph: 20.00
          amount: 3000.00
        - over-by-kph: 40.00
          amount: 6000.00
