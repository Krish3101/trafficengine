spring:
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false

traffic:
  rules:
    speed-threshold: 80.0
    fine-tiers:
      - threshold: 120.0
        amount: 5000
      - threshold: 100.0
        amount: 2000
      - threshold: 80.0
        amount: 1000
