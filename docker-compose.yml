services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: traffic
      POSTGRES_PASSWORD: traffic
      POSTGRES_DB: traffic
    ports:
      - "5433:5432"  # 5433 so it doesn't clash with a Postgres already on 5432
    volumes:
      - traffic-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traffic -d traffic"]
      interval: 2s
      retries: 15

volumes:
  traffic-data:
