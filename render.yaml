services:
  - type: web
    name: traffic-system
    runtime: docker
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: DB_HOST
        fromDatabase:
          name: traffic-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: traffic-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: traffic-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: traffic-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: traffic-db
          property: password

databases:
  - name: traffic-db
    plan: free
