services:
  - type: web
    name: traffic
    env: docker
    plan: free
    autoDeploy: true
    envVars:
      # Set these in the Render dashboard or uncomment and fill in below.
      # If left unset, the app falls back to an in-memory H2 database.
      - key: SPRING_DATASOURCE_URL
        sync: false
        # value: jdbc:postgresql://HOST:5432/trafficdb
      - key: DB_USER
        sync: false
        # value: your_db_user
      - key: DB_PASSWORD
        sync: false
        # value: your_db_password
